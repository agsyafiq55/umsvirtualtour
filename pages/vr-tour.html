<!DOCTYPE html>
<html>
<head>
    <title>UMS Mosque VR by Ag Syafiq</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <a-scene>
        <a-assets>
            <img id="outside-mosque" src="../assets/panoramas/outside_mosque.jpg">
            <img id="0-front-mosque" src="../assets/panoramas/0_front_mosque.jpg">
            <img id="1-front-mosque" src="../assets/panoramas/1_front_mosque.jpg">
            <img id="2-front-mosque" src="../assets/panoramas/2_front_mosque.jpg">
            <video id="center-mosque" src="../assets/videos/center_mosque.mp4" autoplay loop muted crossorigin="anonymous" playsinline></video>
            <img id="left-mosque" src="../assets/panoramas/left_mosque.jpg">

            <img id="outside-mosque1" src="../assets/infographics/outside-mosque1.png">
            <img id="outside-mosque2" src="../assets/infographics/outside-mosque2.png">
            <img id="info-0-front" src="../assets/infographics/0-front-mosque.png">
            <img id="info-2-front" src="../assets/infographics/2-front-mosque.png">
            <img id="mimbar-mihrab" src="../assets/infographics/mimbar-mihrab.png">
            <img id="interior-masjid" src="../assets/infographics/interior-mosque.png">
            <audio id="background-audio" src="../assets/audio/background-music.mp3"></audio>
        </a-assets>

        <a-sound src="#background-audio" autoplay="true" loop="true" volume="0.5" position="0 1.6 0"></a-sound>

        <a-sky id="sky" src="#outside-mosque"></a-sky>

        <a-entity id="next-button" class="clickable"
                  position="0 1.6 -3"
                  rotation="0 0 0"
                  geometry="primitive: circle; radius: 0.5"
                  material="color: #007bff; opacity: 0.8"
                  visible="true">
            <a-circle id="progress-circle-next" position="0 0 0.01" radius="0.05" material="color: green; opacity: 0.8"></a-circle>
            <a-text value="Next" align="center" color="#ffffff" position="0 0 0.1"></a-text>
        </a-entity>

        <a-entity id="back-button" class="clickable"
                  position="-1 1.6 -3"
                  rotation="0 0 0"
                  geometry="primitive: circle; radius: 0.5"
                  material="color: #007bff; opacity: 0.8"
                  visible="false">
            <a-circle id="progress-circle-back" position="0 0 0.01" radius="0.05" material="color: green; opacity: 0.8"></a-circle>
            <a-text value="Back" align="center" color="#ffffff" position="0 0 0.1"></a-text>
        </a-entity>

        <a-plane id="infographic" visible="false"
                position="0 2 -3"
                rotation="0 0 0"
                width="3"
                height="2"
                material="transparent: true;">
        </a-plane>

        <a-camera position="0 1.6 0" fov="80" look-controls>
            <a-entity id="cursor"
                    cursor="fuse: true; fuseTimeout: 3000"
                    raycaster="objects: .clickable"
                    position="0 0 -2"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: yellow; shader: flat">
            </a-entity>
        </a-camera>
    </a-scene>

    <script src="../js/vr-scene-manager.js"></script>
</body>
</html>
